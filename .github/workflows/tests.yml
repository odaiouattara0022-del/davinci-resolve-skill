name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The gear-inventory skill is stdlib-only, so there is nothing to install.
      - name: gear-inventory test suite
        working-directory: gear-inventory/scripts
        run: python -m unittest discover -v

      # The Resolve scripts can only run with DaVinci Resolve open, so the most
      # CI can check is that they are syntactically valid on every version.
      - name: Byte-compile the DaVinci Resolve scripts
        run: python -m compileall -q scripts

      - name: The CLI runs end to end
        working-directory: gear-inventory
        run: |
          python scripts/inventory.py --db ci.db init
          python scripts/inventory.py --db ci.db import templates/import-template.csv --create-locations
          python scripts/inventory.py --db ci.db person add ci "CI runner"
          python scripts/inventory.py --db ci.db checkout CAM-0001 --to ci --days 1
          python scripts/inventory.py --db ci.db out --overdue
          python scripts/inventory.py --db ci.db labels --out labels.html
          python scripts/inventory.py --db ci.db --json report summary
