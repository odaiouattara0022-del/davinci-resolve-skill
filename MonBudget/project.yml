# Recette XcodeGen : permet de régénérer MonBudget.xcodeproj si besoin
#   brew install xcodegen && xcodegen generate
name: MonBudget
options:
  bundleIdPrefix: com.monbudget
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MonBudget:
    type: application
    platform: iOS
    sources:
      - path: MonBudget
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.monbudget.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: MonBudget
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID protège l'accès à vos dépenses."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  MonBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MonBudgetTests
    dependencies:
      - target: MonBudget
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.monbudget.app.tests
